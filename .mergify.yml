pull_request_rules:
  - name: vm5 negative failure-resolution probe
    conditions:
      - title ~= ^vm5 mixed queue (weak|strong)$
    actions:
      queue:
        name: neg-resolution

merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: neg-resolution
    batch_size: 2
    batch_max_failure_resolution_attempts: -1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/hold
    merge_method: merge
