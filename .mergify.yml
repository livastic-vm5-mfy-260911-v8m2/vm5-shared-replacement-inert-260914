pull_request_rules:
  - name: autoqueue vm5 special scope capacity probes
    conditions:
      - title ~= ^vm5 special scope capacity probe [AB]$
    actions:
      queue:

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    manual:
  default_capacity: 1

queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = hold
      - label = vm5-never-merge-capacity-20260917
    merge_method: merge
