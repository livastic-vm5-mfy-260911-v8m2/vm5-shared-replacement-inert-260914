pull_request_rules:
  - name: vm5 custom-path guard autoqueue
    conditions:
      - -mergify-configuration-changed
    actions:
      queue:

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    manual:

queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - label = vm5-never-merge-custom-scope-20260917
    merge_method: merge
