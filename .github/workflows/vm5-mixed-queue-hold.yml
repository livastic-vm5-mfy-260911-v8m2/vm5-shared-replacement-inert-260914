name: vm5-mixed-queue-hold

on:
  pull_request:

permissions:
  contents: read

jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail only Mergify speculative batch PRs
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            mergify/merge-queue/*)
              echo "intentional synthetic batch failure"
              exit 1
              ;;
            *)
              echo "source PR check succeeds"
              exit 0
              ;;
          esac
